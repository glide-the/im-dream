# =============================================================================
# Ink & Memory — Apex Domain (suoxya.com) Reverse Proxy
# =============================================================================
# Serves the apex domain suoxya.com with the SAME content as
# ink-memory.suoxya.com, by proxying directly to the real service behind
# that subdomain (the Docker frontend nginx container on 127.0.0.1:8080) —
# NOT by redirecting or HTTP-proxying to the subdomain URL.
#
# Architecture:
#   suoxya.com/            → 127.0.0.1:8080  (Docker frontend nginx container)
#   suoxya.com SEO files   → 127.0.0.1:8765  (backend generators)
#
# Depends on the `map $http_upgrade` and `upstream ink_backend` blocks defined
# in ink-and-memory.conf.  This file defines its own `upstream ink_memory`
# (127.0.0.1:8080) so the proxy target is explicit and named for the correct
# subdomain — no dependency on ink-and-memory.conf's `ink_frontend` upstream.
#
# Installation (on the remote server):
#   sudo cp suoxya-root.conf /etc/nginx/sites-available/suoxya-root
#   sudo ln -s /etc/nginx/sites-available/suoxya-root /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: Ensure ink-and-memory.conf is also enabled (it provides the map and
#       ink_backend upstream definitions this file relies on).
# =============================================================================

# ── Upstream for ink-memory.suoxya.com (Docker frontend container) ─────────
upstream ink_memory {
    server 127.0.0.1:8080;
    keepalive 32;
}
# =============================================================================
# suoxya.com — Apex domain serving the frontend SPA
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name suoxya.com;

    # ── Access & error logs ─────────────────────────────────────────────
    access_log /var/log/nginx/suoxya-root-access.log;
    error_log  /var/log/nginx/suoxya-root-error.log warn;

    # ── Client body size ────────────────────────────────────────────────
    client_max_body_size 50m;

    # ── Public SEO / AI-search files ────────────────────────────────────
    # Served on the apex origin, but generated by FastAPI from
    # INK_PUBLIC_BASE_URL / INK_BACKEND_PUBLIC_BASE_URL.
    location = /robots.txt {
        proxy_pass http://ink_backend/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap.xml {
        proxy_pass http://ink_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /llms.txt {
        proxy_pass http://ink_backend/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Pass everything to the frontend container ───────────────────────
    # ink-memory.suoxya.com's Docker container (internal nginx) handles:
    #   / → static SPA
    #   /api/ → proxy to backend
    #   /polycli/ → WebSocket proxy to backend
    location / {
        proxy_pass http://ink_memory;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade for PolyCLI (passes through frontend container)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / long-polling for API calls proxied through frontend
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

