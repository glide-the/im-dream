# [Input] deploy/remote-ssh/.env with Admin/Dream origins and runtime budgets.
# [Output] Alibaba Cloud topology overrides for the Remote SSH Dream stack.
# [Pos] Dream-only ECS Compose overlay in deploy/remote-ssh/.
# [Sync] 2026-09-16: remove the shared PostgreSQL network and Dream DATABASE_URL.
# [Sync] 2026-08-22: cap backend block-device reads with deployment-owned
#                    budgets so one Claude turn cannot saturate the ECS system disk.

services:
  ink-backend:
    blkio_config:
      device_read_bps:
        - path: ${DREAM_BACKEND_BLOCK_DEVICE:?Set the ECS backend block device}
          rate: ${DREAM_BACKEND_READ_BPS:?Set the ECS backend read bandwidth budget}
      device_read_iops:
        - path: ${DREAM_BACKEND_BLOCK_DEVICE:?Set the ECS backend block device}
          rate: ${DREAM_BACKEND_READ_IOPS:?Set the ECS backend read IOPS budget}
    environment:
      INK_GATEWAY_BASE_URL: ${DREAM_GATEWAY_ORIGIN:?Set the public HTTPS Admin Gateway origin}
      INK_ADMIN_PRODUCT_API_BASE_URL: ${DREAM_GATEWAY_ORIGIN:?Set the public HTTPS Admin Product/Gateway origin}
      INK_ADMIN_PRODUCT_ORIGIN: ${DREAM_PRODUCT_ORIGIN:?Set the public Dream frontend origin}
      FILE_STORAGE_TYPE: ${DREAM_FILE_STORAGE_TYPE:-local}
