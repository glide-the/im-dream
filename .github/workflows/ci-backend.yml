# [Input] Pull requests that change the Dream backend or this workflow.
# [Output] A Linux Docker build with embedded SDK/Runtime/plugin-management gates.
# [Pos] Required backend CI for both integration and release pull requests.
# [Sync] 2026-09-15: run backend qualification for develop PRs and explicit release reruns without the retired schema-creating smoke harness.
name: Check Backend (CI)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # We build, but we DO NOT push. This verifies the build succeeds.
      - name: Build Docker Image (Dry Run)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ink-backend:ci \
            --load \
            backend
