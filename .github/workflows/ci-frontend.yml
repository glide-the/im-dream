# [Input] Pull requests that change the Dream frontend or this workflow.
# [Output] A frozen pnpm install and production Next.js build check.
# [Pos] Required frontend CI for both integration and release pull requests.
# [Sync] 2026-09-15: cover develop PRs and explicit reruns with the repository Node/pnpm toolchain.
name: Check Frontend (CI)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install & Build
        working-directory: frontend
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
