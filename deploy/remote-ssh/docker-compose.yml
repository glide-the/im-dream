# [Input] Remote SSH REMOTE_* deployment env, backend/frontend Dockerfiles, backend/.env.
# [Output] Two-service remote Compose stack with host-published frontend/backend ports.
# [Pos] Remote SSH Compose template in deploy/remote-ssh/
# [Sync] 2026-06-12: pin backend container PORT to the mapped container port so env_file cannot desync uvicorn and Compose.
version: "3.8"

services:
  ink-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${REMOTE_BACKEND_IMAGE:-ink-backend:remote}
    container_name: ${REMOTE_BACKEND_CONTAINER:-ink-backend}
    restart: unless-stopped
    cpus: "${REMOTE_BACKEND_CPUS:-1.0}"
    mem_limit: "${REMOTE_BACKEND_MEMORY:-1g}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REMOTE_BACKEND_BIND_HOST:-127.0.0.1}:${REMOTE_BACKEND_PORT:-8765}:${REMOTE_BACKEND_CONTAINER_PORT:-8765}"
    volumes:
      - ../../backend/data:/app/data
      - ../../backend/models.json:/app/models.json:ro
    env_file:
      - ../../backend/.env
    environment:
      PORT: ${REMOTE_BACKEND_CONTAINER_PORT:-8765}
      TZ: ${REMOTE_TZ:-UTC}
      AGENT_CWD: ${REMOTE_AGENT_CWD:-/app/data/agent-workspace}
      FILE_STORAGE_TYPE: ${REMOTE_FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_LOCAL_DIR: ${REMOTE_FILE_STORAGE_LOCAL_DIR:-/app/data/file-storage}
      FILE_STORAGE_PREFIX: ${REMOTE_FILE_STORAGE_PREFIX:-uploads}
      INK_CORS_ALLOW_ORIGINS: ${REMOTE_CORS_ALLOW_ORIGINS:-https://ink-frontend.suoxya.com,https://ink-backend.suoxya.com,http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173}
      INK_CORS_ALLOW_CREDENTIALS: ${REMOTE_CORS_ALLOW_CREDENTIALS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT', '8765') + '/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ink-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: ${REMOTE_FRONTEND_IMAGE:-ink-frontend:remote}
    container_name: ${REMOTE_FRONTEND_CONTAINER:-ink-frontend}
    restart: unless-stopped
    cpus: "${REMOTE_FRONTEND_CPUS:-1.0}"
    mem_limit: "${REMOTE_FRONTEND_MEMORY:-256m}"
    ports:
      - "${REMOTE_FRONTEND_BIND_HOST:-127.0.0.1}:${REMOTE_FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_URL: http://ink-backend:${REMOTE_BACKEND_CONTAINER_PORT:-8765}
      API_BASE_URL: ${REMOTE_API_BASE_URL:-https://ink-backend.suoxya.com}
      WS_BASE_URL: ${REMOTE_WS_BASE_URL:-}
    depends_on:
      ink-backend:
        condition: service_healthy
