# [Input] Dream backend project metadata and exact Python dependency contract.
# [Output] Backend package identity and uv dependency resolution input.
# [Pos] Canonical backend project manifest; exported requirements and uv.lock must agree.
# [Sync] 2026-09-15: remove unused local Authlib/bcrypt authority dependencies; retained versions and SDK pins remain unchanged.
# [Sync] 2026-09-16: move psycopg to the development group after production PostgreSQL access moved behind Admin DTO APIs.
# [Sync] 2026-09-13: bump project metadata to 0.1.3 for the unified original-module Runtime 0.1.9; SDK stays 0.2.145.
# [Sync] 2026-09-15: bump project metadata to 0.1.4 for Runtime 0.1.10 plugin management; SDK stays 0.2.145.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-and-memory-backend"
version = "0.1.4"
description = "Ink & Memory backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "itsdangerous>=2.2,<3",
  "uvicorn>=0.22,<1",
  "httpx[socks]>=0.28,<0.29",
  "dashscope>=1.24,<2",
  "PyJWT>=2,<3",
  "pydantic>=2.5,<3",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "rich>=13,<15",
  "tqdm>=4.65,<5",
  "python-dotenv>=1,<2",
  "eval-type-backport>=0.2,<1",
  "websockets>=12,<14",
  "ink-claude-dream-agent-sdk==0.2.145",
  "mcp>=1.27.0",
  "cryptography>=46,<47",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.9,<1",
  "json-repair>=0.35,<1",
  "pyyaml>=6,<7",
  "redis>=5,<8",
]

[dependency-groups]
dev = [
  "psycopg[binary,pool]>=3.2,<4",
]

[tool.uv]
package = false
