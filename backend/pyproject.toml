[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-and-memory-backend"
version = "0.1.0"
description = "Ink & Memory backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "itsdangerous>=2.2,<3",
  "uvicorn>=0.22,<1",
  "httpx[socks]>=0.28,<0.29",
  "authlib==1.6.10",
  "dashscope>=1.24,<2",
  "bcrypt>=4,<5",
  "PyJWT>=2,<3",
  "pydantic>=2.5,<3",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "rich>=13,<15",
  "tqdm>=4.65,<5",
  "python-dotenv>=1,<2",
  "eval-type-backport>=0.2,<1",
  "websockets>=12,<14",
  "ink-claude-dream-agent-sdk==0.2.144",
  "mcp>=1.27.0",
  "cryptography>=46,<47",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.9,<1",
  "json-repair>=0.35,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<8",
]

[tool.uv]
package = false
